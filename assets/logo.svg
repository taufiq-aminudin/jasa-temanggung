<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="45%" stop-color="#0f3eb5"/>
      <stop offset="100%" stop-color="#1d66f0"/>
    </linearGradient>

    <!-- Teal-Cyan J Gradient -->
    <linearGradient id="logoTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- White T Gradient -->
    <linearGradient id="logoWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04122c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon Box (70x70) -->
  <g transform="translate(5, 5)">
    <rect width="70" height="70" rx="18" fill="url(#logoBg)"/>
    <rect x="1" y="1" width="68" height="68" rx="17" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>

    <!-- Mountain Silhouette -->
    <path d="M10 52 L26 30 L36 44 L50 24 L62 52 Z" fill="rgba(255, 255, 255, 0.1)"/>

    <!-- J Path -->
    <path d="M18 28 C18 26 19.5 24 21.5 24 H28 V40 C28 45 24 49 19 49 C15.5 49 13 47 11.5 44.5 L17.5 41 C18 41.8 18.5 42.5 19.5 42.5 C20.8 42.5 21.5 41.5 21.5 40 V31 H21.5 C19.5 31 18 29.5 18 28 Z" 
          fill="url(#logoTeal)" filter="url(#logoShadow)"/>

    <!-- T Path -->
    <path d="M26 23 C26 21 27.5 19 29.5 19 H56 C58 19 59.5 21 59.5 23 C59.5 25 58 27 56 27 H46 V50 C46 52 44.5 54 42.5 54 C40.5 54 39 52 39 50 V27 H29.5 C27.5 27 26 25 26 23 Z" 
          fill="url(#logoWhite)" filter="url(#logoShadow)"/>

    <!-- Checkmark Badge -->
    <circle cx="53" cy="43" r="9" fill="#0b1a36" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="53" cy="43" r="7.5" fill="#10b981"/>
    <path d="M50 43 L52.2 45.2 L56.5 40.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Star Sparkle -->
    <path d="M57 12 C57 15 60 15 60 15 C60 15 57 15 57 18 C57 15 54 15 54 15 C54 15 57 15 57 12 Z" fill="url(#logoGold)"/>
  </g>

  <!-- Typography -->
  <text x="90" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#0b1220" letter-spacing="-0.5">
    Jasa <tspan font-weight="900" fill="#1457d9">Temanggung</tspan>
  </text>
  <text x="91" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">
    ONE-STOP SERVICE &amp; DIREKTORI LOKAL
  </text>
</svg>
