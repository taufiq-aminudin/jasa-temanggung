<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="jtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="45%" stop-color="#0f3eb5"/>
      <stop offset="100%" stop-color="#1d66f0"/>
    </linearGradient>

    <!-- Teal-Cyan J Gradient -->
    <linearGradient id="jtTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- White-Ice T Gradient -->
    <linearGradient id="jtWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="jtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="jtGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#04122c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Premium Stroke -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#jtBg)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="30.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Twin Peak Mountain Silhouette (Sindoro & Sumbing) -->
  <path d="M18 90 L44 52 L62 76 L86 42 L110 90 Z" fill="rgba(255, 255, 255, 0.08)"/>

  <!-- Stylized J Curve (Left side swoop) -->
  <path d="M30 46 C30 42.6863 32.6863 40 36 40 H48 V68 C48 76.8366 40.8366 84 32 84 C26.2 84 21.8 80.5 19.5 76 L30 69.5 C30.6 71 31.5 72 33 72 C35.2091 72 37 70.2091 37 68 V52 H36 C32.6863 52 30 49.3137 30 46 Z" 
        fill="url(#jtTeal)" filter="url(#jtGlow)"/>

  <!-- Stylized T Geometric Nexus (Crossbar & Center Pillar) -->
  <path d="M44 38 C44 34.6863 46.6863 32 50 32 H94 C97.3137 32 100 34.6863 100 38 C100 41.3137 97.3137 44 94 44 H78 V86 C78 89.3137 75.3137 92 72 92 C68.6863 92 66 89.3137 66 86 V44 H50 C46.6863 44 44 41.3137 44 38 Z" 
        fill="url(#jtWhite)" filter="url(#jtGlow)"/>

  <!-- Verified Trust Checkmark Emblem in center -->
  <circle cx="94" cy="74" r="16" fill="#0b1a36" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="94" cy="74" r="13" fill="#10b981"/>
  <path d="M89 74.5 L92.5 78 L99.5 70.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- North Star / Sparkle in Top Right -->
  <path d="M100 22 C100 27 105 27 105 27 C105 27 100 27 100 32 C100 27 95 27 95 27 C95 27 100 27 100 22 Z" fill="url(#jtGold)"/>
</svg>
