<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="logo-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logomark Emblem Container -->
  <g transform="translate(10, 10)">
    <!-- Base Rounded Square with Dual Stroke -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logo-bg)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="60" height="60" rx="16" fill="none" stroke="url(#logo-blue)" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Ambient Blue Glow -->
    <circle cx="30" cy="30" r="18" fill="url(#logo-blue)" opacity="0.25" filter="url(#logo-glow)"/>

    <!-- F-Symbol Vertical Pillar -->
    <rect x="15" y="14" width="8" height="32" rx="2" fill="url(#logo-blue)"/>
    
    <!-- Top Horizontal Wing -->
    <path d="M23 14h18c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H23V14z" fill="url(#logo-blue)"/>
    
    <!-- Middle Cyan/Emerald Horizontal Wing -->
    <path d="M23 27h12c1.1 0 2 .9 2 2v3.5c0 1.1-.9 2-2 2H23V27z" fill="url(#logo-cyan)"/>
    
    <!-- Dynamic Growth Triangle & Accent Pulse -->
    <polygon points="43,14 49,14 45,22 39,22" fill="#38bdf8"/>
    <circle cx="47" cy="11" r="2.5" fill="#10b981"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(84, 18)">
    <!-- "FUTech" Text -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#text-grad)" letter-spacing="-0.5">
      FU<tspan fill="#38bdf8">Tech</tspan>
    </text>

    <!-- Indonesian Flag Tag / Performance Badge -->
    <g transform="translate(118, 10)">
      <rect x="0" y="0" width="86" height="20" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
      <!-- Indonesian Red-White Micro Accent -->
      <rect x="6" y="5" width="8" height="5" rx="1" fill="#ef4444"/>
      <rect x="6" y="10" width="8" height="5" rx="1" fill="#ffffff"/>
      <text x="18" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#60a5fa" letter-spacing="1">
        INDONESIA
      </text>
    </g>

    <!-- Tagline Subtext -->
    <text x="1" y="44" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500" fill="#94a3b8" letter-spacing="1.2">
      PERFORMANCE &amp; DIGITAL GROWTH
    </text>
  </g>
</svg>
